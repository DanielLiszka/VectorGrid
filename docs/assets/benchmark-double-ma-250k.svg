<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VectorGrid vs VectorBT benchmark, March public 250,000-pair snapshot</title>
  <desc id="desc">Horizontal bar chart comparing measured times on a logarithmic scale for March public 250,000-pair snapshot. Visible chart labels are rounded to one decimal place. VectorGrid GPU 233.7 ms. VectorGrid CPU 15,202.4 ms. VectorBT CPU 445,240.3 ms. The GPU run is about 1,906× faster than VectorBT CPU. VectorGrid CPU is shown for reference.</desc>
  <rect width="1200" height="720" rx="28" fill="#F8FAFC"/>
  <rect x="20" y="20" width="1160" height="680" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="854" y="52" width="290" height="36" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="870" y="75" fill="#1D4ED8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">March public 250k snapshot</text>
  <text x="56" y="84" fill="#0F172A" font-size="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">VectorGrid vs VectorBT benchmark</text>
  <text x="56" y="118" fill="#475569" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif">250,000 backtests over 200,000 bars · ALMA/ALMA</text>
  <rect x="56" y="148" width="372" height="38" rx="19" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="72" y="173" fill="#065F46" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">1,906× faster than VectorBT CPU</text>
  <text x="56" y="204" fill="#64748B" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">VectorGrid CPU shown for reference · log scale · lower is better</text>
  <text x="56" y="250" fill="#0F172A" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Measured time</text>
  <line x1="360.00" y1="266" x2="360.00" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="362.00" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="start">1 ms</text>
  <line x1="456.67" y1="266" x2="456.67" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="456.67" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">10 ms</text>
  <line x1="553.33" y1="266" x2="553.33" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="553.33" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">100 ms</text>
  <line x1="650.00" y1="266" x2="650.00" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="650.00" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">1 s</text>
  <line x1="746.67" y1="266" x2="746.67" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="746.67" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">10 s</text>
  <line x1="843.33" y1="266" x2="843.33" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="843.33" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">100 s</text>
  <line x1="940.00" y1="266" x2="940.00" y2="500" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="938.00" y="250" fill="#475569" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="end">1000 s</text>
  <line x1="360" y1="322" x2="940" y2="322" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
  <line x1="360" y1="322" x2="588.96" y2="322" stroke="#14B8A6" stroke-width="20" stroke-linecap="round"/>
  <circle cx="68" cy="320" r="7" fill="#14B8A6"/>
  <text x="92" y="328" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">VectorGrid GPU</text>
  <text x="1110" y="328" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="end" style="font-variant-numeric: tabular-nums;">233.7 ms</text>
  <line x1="360" y1="402" x2="940" y2="402" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
  <line x1="360" y1="402" x2="764.25" y2="402" stroke="#F59E0B" stroke-width="20" stroke-linecap="round"/>
  <circle cx="68" cy="400" r="7" fill="#F59E0B"/>
  <text x="92" y="408" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">VectorGrid CPU</text>
  <text x="1110" y="408" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="end" style="font-variant-numeric: tabular-nums;">15,202.4 ms</text>
  <line x1="360" y1="482" x2="940" y2="482" stroke="#F1F5F9" stroke-width="20" stroke-linecap="round"/>
  <line x1="360" y1="482" x2="906.03" y2="482" stroke="#334155" stroke-width="20" stroke-linecap="round"/>
  <circle cx="68" cy="480" r="7" fill="#334155"/>
  <text x="92" y="488" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">VectorBT CPU</text>
  <text x="1110" y="488" fill="#0F172A" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="end" style="font-variant-numeric: tabular-nums;">445,240.3 ms</text>
  <line x1="56" y1="540" x2="1144" y2="540" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="56" y="580" fill="#475569" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">Hardware: AMD Ryzen 9 9950X · NVIDIA GeForce RTX 4090</text>
  <text x="56" y="608" fill="#475569" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">Warm benchmark run: dataset loaded once, warmup runs before trials, resident market-series reuse</text>
  <text x="56" y="636" fill="#475569" font-size="17" font-family="Inter, Segoe UI, Arial, sans-serif">VectorBT measured as a CPU Python workflow · visible timings rounded to 0.1 ms</text>
</svg>
