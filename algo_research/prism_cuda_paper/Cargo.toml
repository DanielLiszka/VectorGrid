[package]
name = "prism_cuda_paper"
version = "0.1.0"
edition = "2021"
description = "PRISM-SIG-HVCOST reference Rust host implementation with CUDA/PTX kernel artifacts"
license = "MIT"

[lib]
name = "prism_cuda_paper"
path = "src/lib.rs"

[features]
default = []
cuda-ptx = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
