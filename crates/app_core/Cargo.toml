[package]
name = "ta_app_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["vector-ta/cuda", "dep:cust"]
cuda-backtest-kernel = ["cuda"]
nvtx-profiling = []
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
rayon = "1.10.0"
ta_strategies = { path = "../strategies" }
ta_optimizer = { path = "../optimizer" }
vector-ta = "0.2.4"
rand = "0.8.5"
csv = "1.3"
cust = { version = "0.3", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.5.1"

[build-dependencies]
which = "7.0"

[[bench]]
name = "double_ma_opt"
harness = false

[[bench]]
name = "double_ma_metrics"
harness = false

[[bench]]
name = "composite_mo_opt"
harness = false

[[bench]]
name = "composite_cpu_opt"
harness = false

[[bench]]
name = "asr_opt"
harness = false

[[bench]]
name = "vcc_opt"
harness = false

[[bench]]
name = "vemr_opt"
harness = false

[[bench]]
name = "vcet_opt"
harness = false

[[bench]]
name = "rocb_opt"
harness = false

[[bench]]
name = "mkcs_opt"
harness = false

[[bench]]
name = "gpu_native_expansion_opt"
harness = false

[[bench]]
name = "dynamic_strategy_cpu"
harness = false

[[bench]]
name = "composite_validation_workflow"
harness = false

[[bench]]
name = "double_ma_validation_workflow"
harness = false

[[bench]]
name = "double_ma_followup_workflow"
harness = false

[[bench]]
name = "meta_select_workflow"
harness = false

[[bench]]
name = "e2e_workflow_ml"
harness = false

[[bin]]
name = "ta_cli"
path = "src/bin/ta_cli.rs"
required-features = ["cli"]

[[bin]]
name = "stage6b_kernel_report"
path = "src/bin/stage6b_kernel_report.rs"
