<svg width="100" height="100" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="va-title-anim va-desc-anim">
  <title id="va-title-anim">VectorAlpha letterform logo (Animated)</title>
  <desc id="va-desc-anim">Stylized Greek alpha with input and output vector bars.</desc>
  
  <defs>
    <linearGradient id="va-gradient-anim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(59, 130, 246)" />
      <stop offset="1" stop-color="rgb(139, 92, 246)" />
    </linearGradient>

    <style>
      /* Animation Keyframes */
      @keyframes va-inShift {
        0%   { transform: translateX(0);    opacity: 1; }
        45%  { transform: translateX(18px); opacity: 1; }
        100% { transform: translateX(18px); opacity: 0; }
      }

      @keyframes va-outShift {
        0%   { transform: translateX(-18px); opacity: 0; }
        55%  { transform: translateX(-18px); opacity: 1; }
        100% { transform: translateX(0);     opacity: 1; }
      }

      @keyframes va-flare {
        0%, 100% { fill: url(#va-gradient-anim); }
        50%      { fill: rgb(59, 130, 246); }
      }

      /* Class Assignments */
      .va-input-bar  { animation: va-inShift 1.2s ease-in-out infinite; }
      .va-output-bar { animation: va-outShift 1.2s ease-in-out infinite; }
      .va-alpha      { animation: va-flare 2.4s ease-in-out infinite; }

      /* Preferences */
      @media (prefers-reduced-motion: reduce) {
        .va-input-bar, .va-output-bar, .va-alpha { animation-play-state: paused; }
      }
      @media (forced-colors: active) {
        .va-input-bar, .va-output-bar, .va-alpha { fill: currentColor !important; }
      }
      @media (prefers-contrast: more) {
        .va-alpha, .va-output-bar { fill: currentColor; }
      }
    </style>
  </defs>

  <g transform="translate(10 6)">
    <!-- Input bars (left column) -->
    <g>
      <rect class="va-input-bar" x="0" y="8" width="8" height="2" fill="rgb(100, 116, 139)" style="animation-delay: 0s" />
      <rect class="va-input-bar" x="0" y="14" width="8" height="2" fill="rgb(100, 116, 139)" style="animation-delay: 0.08s" />
      <rect class="va-input-bar" x="0" y="20" width="8" height="2" fill="rgb(100, 116, 139)" style="animation-delay: 0.16s" />
      <rect class="va-input-bar" x="0" y="26" width="8" height="2" fill="rgb(100, 116, 139)" style="animation-delay: 0.24s" />
    </g>

    <!-- Greek alpha letterform -->
    <text 
      class="va-alpha"
      x="20" 
      y="28" 
      text-anchor="middle" 
      font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
      font-size="28" 
      font-weight="700" 
      fill="url(#va-gradient-anim)">
      α
    </text>

    <!-- Output bars (right column) -->
    <g>
      <rect class="va-output-bar" x="32" y="8" width="8" height="2" fill="url(#va-gradient-anim)" style="animation-delay: 0.24s" />
      <rect class="va-output-bar" x="32" y="14" width="8" height="2" fill="url(#va-gradient-anim)" style="animation-delay: 0.16s" />
      <rect class="va-output-bar" x="32" y="20" width="8" height="2" fill="url(#va-gradient-anim)" style="animation-delay: 0.08s" />
      <rect class="va-output-bar" x="32" y="26" width="8" height="2" fill="url(#va-gradient-anim)" style="animation-delay: 0s" />
    </g>
  </g>
</svg>