[package]
name = "ta_desktop_demo_app"
version = "0.1.0"
edition = "2021"
default-run = "ta_desktop_demo_app"
autobins = false

[lib]
test = false
doctest = false

[[bin]]
name = "ta_desktop_demo_app"
path = "src/main.rs"
test = false
required-features = ["desktop-ui"]

[[bin]]
name = "ta_release_readiness"
path = "src/bin/ta_release_readiness.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_headless_validate"
path = "src/bin/ta_headless_validate.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_dataset_download"
path = "src/bin/ta_options_dataset_download.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_dataset_import"
path = "src/bin/ta_options_dataset_import.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_expression_compare"
path = "src/bin/ta_options_expression_compare.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_expression_feasibility"
path = "src/bin/ta_options_expression_feasibility.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_expression_lifecycle"
path = "src/bin/ta_options_expression_lifecycle.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_expression_smoke"
path = "src/bin/ta_options_expression_smoke.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_options_parent_artifact"
path = "src/bin/ta_options_parent_artifact.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_app_path_faceoff"
path = "src/bin/ta_app_path_faceoff.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_campaign_perf"
path = "src/bin/ta_campaign_perf.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_campaign_restart_qa"
path = "src/bin/ta_campaign_restart_qa.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_cpu_reliability_soak"
path = "src/bin/ta_cpu_reliability_soak.rs"
test = true
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_double_ma_validation_cost"
path = "src/bin/ta_double_ma_validation_cost.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_perf_authority_support"
path = "src/bin/ta_perf_authority_support.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_profile_route_matrix"
path = "src/bin/ta_profile_route_matrix.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_refactor_snapshots"
path = "src/bin/ta_refactor_snapshots.rs"
test = false
required-features = ["maintainer-tools"]

[[bin]]
name = "ta_workflow_regression"
path = "src/bin/ta_workflow_regression.rs"
test = false
required-features = ["maintainer-tools"]

[features]
default = ["custom-protocol", "desktop-ui"]
desktop-ui = []
maintainer-tools = []
custom-protocol = ["tauri/custom-protocol"]
cuda = ["ta_app_core/cuda", "vector-ta/cuda"]
cuda-backtest-kernel = ["cuda", "ta_app_core/cuda-backtest-kernel"]
nvtx-profiling = ["ta_app_core/nvtx-profiling"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bincode = "1"
sha2 = "0.10"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
clap = { version = "4.5", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

vector-ta = "0.2.4"
ta_app_core = { path = "../crates/app_core" }
ta_optimizer = { path = "../crates/optimizer" }
ta_strategies = { path = "../crates/strategies" }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "3"
base64 = "0.22"
rust_xlsxwriter = "0.92.4"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
log = "0.4.29"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.7.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zip = "2"
