[package]
name = "ta_desktop_demo_app"
version = "0.1.0"
edition = "2021"
default-run = "ta_desktop_demo_app"

[lib]
test = false
doctest = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["ta_app_core/cuda", "vector-ta/cuda", "cust"]
cuda-backtest-kernel = ["cuda", "ta_app_core/cuda-backtest-kernel"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
clap = { version = "4.5", features = ["derive"] }

vector-ta = "0.1.3"
ta_app_core = { path = "../crates/app_core" }
ta_optimizer = { path = "../crates/optimizer" }
ta_strategies = { path = "../crates/strategies" }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "3"
base64 = "0.22"
rust_xlsxwriter = "0.92.4"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
cust = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.7.1"

[build-dependencies]
tauri-build = "2"
