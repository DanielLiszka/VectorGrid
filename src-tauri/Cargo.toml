[package]
name = "ta_desktop_demo_app"
version = "0.1.0"
edition = "2021"
default-run = "ta_desktop_demo_app"

[lib]
test = false
doctest = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["ta_app_core/cuda", "vector-ta/cuda", "cust"]
cuda-backtest-kernel = ["cuda", "ta_app_core/cuda-backtest-kernel"]
nvtx-profiling = ["ta_app_core/nvtx-profiling"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
clap = { version = "4.5", features = ["derive"] }

vector-ta = "0.2.4"
ta_app_core = { path = "../crates/app_core" }
ta_optimizer = { path = "../crates/optimizer" }
ta_strategies = { path = "../crates/strategies" }
chrono = { version = "0.4", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "3"
base64 = "0.22"
rust_xlsxwriter = "0.92.4"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
cust = { version = "0.3", optional = true }
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
log = "0.4.29"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.7.1"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
zip = "2"
