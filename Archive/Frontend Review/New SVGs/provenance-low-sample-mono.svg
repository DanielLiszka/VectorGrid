<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor">
  <title>Low sample count</title>
  <desc>Sparse histogram indicating insufficient observational depth</desc>

  <!-- Baseline axis -->
  <rect x="3" y="19" width="18.5" height="1.2" rx="0.6" opacity="0.3"/>

  <!-- 5 bin positions, each 2.5 wide, 1-unit gaps -->
  <!-- Ghost bins 1, 3, 5: matching rect geometry, minimal height -->
  <rect x="4.25"  y="17.25" width="2.5" height="1.75" rx="0.6" opacity="0.13"/>
  <rect x="11.25" y="17.25" width="2.5" height="1.75" rx="0.6" opacity="0.13"/>
  <rect x="18.25" y="17.25" width="2.5" height="1.75" rx="0.6" opacity="0.13"/>

  <!-- Present bars at bins 2 and 4 — different heights for distribution feel -->
  <rect x="7.75"  y="12"  width="2.5" height="7"  rx="0.75" opacity="0.72"/>
  <rect x="14.75" y="5.5" width="2.5" height="13.5" rx="0.75" opacity="0.72"/>
</svg>
