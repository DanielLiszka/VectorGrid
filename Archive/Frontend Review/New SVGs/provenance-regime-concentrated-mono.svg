<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor">
  <title>Regime concentrated</title>
  <desc>Regime strip with one narrow dominant band amid broader secondary regimes</desc>

  <!-- 4 segments, narrow dominant in 2nd position (off-center) -->

  <!-- Broad regime 1 -->
  <rect x="2.5" y="10" width="4" height="4" rx="0.6" opacity="0.15"/>
  <!-- NARROW DOMINANT — bright, taller -->
  <rect x="7.25" y="7" width="2.5" height="10" rx="0.6" opacity="0.68"/>
  <!-- Broad regime 2 -->
  <rect x="10.5" y="10" width="5.5" height="4" rx="0.6" opacity="0.15"/>
  <!-- Broad regime 3 -->
  <rect x="16.75" y="10" width="4.5" height="4" rx="0.6" opacity="0.15"/>
</svg>
