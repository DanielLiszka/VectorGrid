  <!-- Segment 2: NARROW DOMINANT — amber -->
  <rect x="7.25" y="7" width="2.5" height="10" rx="0.6" fill="#BA7517" opacity="0.72"/>
  <!-- Segment 3: broad regime, secondary -->
  <rect x="10.5" y="10" width="5.5" height="4" rx="0.6" opacity="0.15"/>
  <!-- Segment 4: broad regime, secondary -->
  <rect x="16.75" y="10" width="4.5" height="4" rx="0.6" opacity="0.15"/>
</svg>
