<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round">
  <title>Candidate focus</title>
  <desc>One primary review tile centered among muted peer tiles</desc>

  <!-- Left peer — muted, secondary -->
  <rect x="2" y="8" width="5" height="8" rx="0.75" fill="currentColor" stroke="none" opacity="0.15"/>

  <!-- Center tile — primary focus, taller, brighter, with metric lines -->
  <rect x="8.5" y="5" width="7" height="14" rx="1.25" fill="currentColor" stroke="none" opacity="0.5"/>
  <line x1="10.5" y1="9" x2="13.5" y2="9" stroke-width="1.25" fill="none" opacity="0.3"/>
  <line x1="10.5" y1="12" x2="13" y2="12" stroke-width="1.25" fill="none" opacity="0.2"/>

  <!-- Right peer — muted, secondary -->
  <rect x="17" y="8" width="5" height="8" rx="0.75" fill="currentColor" stroke="none" opacity="0.15"/>
</svg>
