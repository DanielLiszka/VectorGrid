  <rect x="11.25" y="17.25" width="2.5" height="1.75" rx="0.6" opacity="0.13"/>
  <rect x="18.25" y="17.25" width="2.5" height="1.75" rx="0.6" opacity="0.13"/>

  <!-- Present bars — amber 600 -->
  <rect x="7.75"  y="12"  width="2.5" height="7"  rx="0.75" fill="#BA7517" opacity="0.82"/>
  <rect x="14.75" y="5.5" width="2.5" height="13.5" rx="0.75" fill="#BA7517" opacity="0.82"/>
