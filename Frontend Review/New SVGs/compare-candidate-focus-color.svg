<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round">
  <title>Candidate focus</title>
  <desc>One central review card promoted above muted peer cards</desc>

  <!-- Left peer -->
  <rect x="3.5" y="9" width="3.5" height="6" rx="0.7" fill="currentColor" stroke="none" opacity="0.1"/>

  <!-- Center card -->
  <rect x="9" y="4" width="6" height="16" rx="1.2" fill="#BA7517" stroke="none" opacity="0.62"/>

  <!-- Right peer -->
  <rect x="17" y="9" width="3.5" height="6" rx="0.7" fill="currentColor" stroke="none" opacity="0.1"/>
</svg>
