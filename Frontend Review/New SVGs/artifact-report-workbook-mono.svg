<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" fill="none">
  <title>Report Workbook</title>
  <desc>Structured analytical report workbook with dense grid and emphasized summary region</desc>

  <!-- Summary row fill -->
  <rect x="3" y="17" width="18" height="5" rx="1" fill="currentColor" opacity="0.12"/>

  <!-- Header row fill -->
  <rect x="3" y="2" width="18" height="4.5" rx="1" fill="currentColor" opacity="0.08"/>

  <!-- Outer frame -->
  <rect x="3" y="2" width="18" height="20" rx="1.5" stroke="currentColor" stroke-width="1.25"/>

  <!-- Header separator -->
  <line x1="3" y1="6.5" x2="21" y2="6.5" stroke="currentColor" stroke-width="1"/>

  <!-- Summary separator -->
  <line x1="3" y1="17" x2="21" y2="17" stroke="currentColor" stroke-width="1"/>

  <!-- Data row dividers -->
  <line x1="3"  y1="10.5"  x2="21" y2="10.5"  stroke="currentColor" stroke-width="0.6" opacity="0.6"/>
  <line x1="3"  y1="13.75" x2="21" y2="13.75" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>

  <!-- Column dividers -->
  <line x1="9.5"  y1="6.5" x2="9.5"  y2="22" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>
  <line x1="15.5" y1="6.5" x2="15.5" y2="22" stroke="currentColor" stroke-width="0.6" opacity="0.6"/>

  <!-- Summary row right cell: aggregate bar -->
  <rect x="16.5" y="18.5" width="3.5" height="2" rx="0.5" fill="currentColor" opacity="0.4"/>
</svg>
