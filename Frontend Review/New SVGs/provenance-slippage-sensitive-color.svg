<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Slippage sensitive</title>
  <desc>An ideal path and a realized path separating under execution friction</desc>

  <!-- Friction band between ideal and realized path -->
  <path
    d="M4 17.75 L20 7.25
       L20 11.15
       C13.2 14.35, 8.5 16.9, 4 17.75 Z"
    fill="#BA7517"
    stroke="none"
    opacity="0.12"
  />

  <!-- Ideal path -->
  <line x1="4" y1="17.75" x2="20" y2="7.25" stroke="currentColor" stroke-width="1.6" opacity="0.24"/>

  <!-- Realized path degraded by slippage -->
  <path d="M4 17.75 C8.5 16.9, 13.2 14.35, 20 11.15" stroke="#BA7517" stroke-width="2.1" opacity="0.74"/>
</svg>
