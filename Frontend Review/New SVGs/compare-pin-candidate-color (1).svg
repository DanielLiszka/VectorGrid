<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round">
  <title>Pin candidate</title>
  <desc>A result tile being added to the compare set</desc>

  <!-- Result tile -->
  <rect x="3.5" y="3" width="13" height="14" rx="1.5" fill="currentColor" stroke="none" opacity="0.4"/>

  <!-- Metric lines -->
  <line x1="6" y1="7" x2="14" y2="7" stroke-width="1.25" fill="none" opacity="0.25"/>
  <line x1="6" y1="10.5" x2="11.5" y2="10.5" stroke-width="1.25" fill="none" opacity="0.18"/>

  <!-- Plus mark — amber action cue -->
  <line x1="18" y1="15" x2="18" y2="21" stroke="#BA7517" stroke-width="2" fill="none" opacity="0.7"/>
  <line x1="15" y1="18" x2="21" y2="18" stroke="#BA7517" stroke-width="2" fill="none" opacity="0.7"/>
</svg>
