<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>Slippage sensitive</title>
  <desc>A path dragged below its ideal straight trajectory by execution friction</desc>

  <!-- Slippage wedge — area between straight ideal and sagging actual -->
  <path d="M3.5 19 L20.5 5
           L20.5 11
           C15 14, 9 17, 3.5 19 Z"
        fill="currentColor" stroke="none" opacity="0.09"/>

  <!-- Ideal trajectory — clean straight diagonal, faint reference -->
  <line x1="3.5" y1="19" x2="20.5" y2="5" stroke-width="1.5" opacity="0.25"/>

  <!-- Actual path — starts aligned, bows below under accumulated friction -->
  <path d="M3.5 19 C9 17, 15 14, 20.5 11" stroke-width="1.8" fill="none" opacity="0.7"/>
</svg>
