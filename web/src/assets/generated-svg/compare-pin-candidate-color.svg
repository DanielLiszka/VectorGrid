<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round">
  <title>Pin candidate</title>
  <desc>A candidate card being attached into a compare slot</desc>

  <!-- Candidate card -->
  <rect x="3.25" y="4" width="10.5" height="12.25" rx="1.35" fill="currentColor" stroke="none" opacity="0.34"/>

  <!-- Single data cue -->
  <rect x="5.6" y="7.2" width="5.3" height="1.35" rx="0.675" fill="currentColor" stroke="none" opacity="0.18"/>

  <!-- Compare-slot rail -->
  <rect x="16.2" y="6.35" width="4.25" height="8" rx="1" fill="currentColor" stroke="none" opacity="0.14"/>
  <line x1="13.75" y1="10.35" x2="16.1" y2="10.35" stroke="currentColor" stroke-width="1.35" fill="none" opacity="0.18"/>

  <!-- Add cue is attached to the compare structure, not floating away from it -->
  <line x1="15.1" y1="14.9" x2="15.1" y2="20" stroke="#BA7517" stroke-width="2.1" fill="none" opacity="0.78"/>
  <line x1="12.55" y1="17.45" x2="17.65" y2="17.45" stroke="#BA7517" stroke-width="2.1" fill="none" opacity="0.78"/>
</svg>
