<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor">
  <title>Task queued</title>
  <desc>Three items queued in an orderly processing pipeline</desc>

  <!-- Item 3 (back) -->
  <rect x="8" y="3" width="8" height="4.5" rx="1" opacity="0.18"/>
  <!-- Item 2 (middle) -->
  <rect x="8" y="9.75" width="8" height="4.5" rx="1" opacity="0.25"/>
  <!-- Item 1 (front — amber, next to process) -->
  <rect x="8" y="16.5" width="8" height="4.5" rx="1" fill="#BA7517" opacity="0.55"/>
</svg>
