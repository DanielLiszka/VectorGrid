<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor">
  <title>Dataset changed</title>
  <desc>Stacked data layers with one shifted indicating source context change</desc>

  <!-- Three data layers stacked vertically
       Layers 1 and 3 are aligned — the original lineage
       Layer 2 is shifted right — one source in the lineage changed -->

  <!-- Layer 1: original, aligned -->
  <rect x="3" y="5" width="14" height="3.5" rx="0.75" opacity="0.4"/>
  <!-- Layer 2: SHIFTED — source changed -->
  <rect x="7" y="10.25" width="14" height="3.5" rx="0.75" opacity="0.6"/>
  <!-- Layer 3: original, aligned -->
  <rect x="3" y="15.5" width="14" height="3.5" rx="0.75" opacity="0.4"/>
</svg>
