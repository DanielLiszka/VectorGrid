<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" fill="currentColor" stroke="currentColor" stroke-linecap="round">
  <title>Replace pinned</title>
  <desc>One candidate card replacing another in the compare set</desc>

  <!-- Outgoing card — ghost -->
  <rect x="2.5" y="2.5" width="12" height="14" rx="1.25" fill="currentColor" stroke="none" opacity="0.14"/>

  <!-- Incoming card — amber, the replacement -->
  <rect x="9.5" y="7.5" width="12" height="14" rx="1.25" fill="#BA7517" stroke="none" opacity="0.55"/>

  <!-- Metric lines — amber -->
  <line x1="12" y1="12" x2="19" y2="12" stroke="#BA7517" stroke-width="1.25" fill="none" opacity="0.3"/>
  <line x1="12" y1="15.5" x2="17" y2="15.5" stroke="#BA7517" stroke-width="1.25" fill="none" opacity="0.2"/>
</svg>
